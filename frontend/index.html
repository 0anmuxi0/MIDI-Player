<!DOCTYPE html>
<html lang="zh-CN" class="theme-light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>MIDI 可视化播放器</title>
    <link rel="icon" type="image/png" href="/app-icon.png">
    <script>
        // 在样式表加载前确定主题，避免深色模式下的白色闪屏
        (function () {
            var mode = 'system';
            try { mode = localStorage.getItem('midiPlayer.theme') || 'system'; } catch (e) { }
            if (mode !== 'light' && mode !== 'dark' && mode !== 'system') mode = 'system';
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var dark = mode === 'dark' || (mode === 'system' && prefersDark);
            var root = document.documentElement;
            root.classList.remove('theme-light', 'theme-dark');
            root.classList.add(dark ? 'theme-dark' : 'theme-light');
            root.setAttribute('data-theme-mode', mode);
        })();
    </script>
    <style>
        /* 启动画面：内联样式 + 不依赖外部资源，随文档立即渲染 */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F3F3F3;
            transition: opacity 220ms ease;
        }

        html.theme-dark #splash {
            background: #202020;
        }

        #splash.is-hidden {
            opacity: 0;
            pointer-events: none;
        }

        #splash img {
            width: 132px;
            height: 132px;
            -webkit-user-drag: none;
            user-select: none;
            animation: splashIconIn 340ms cubic-bezier(0.16, 0.84, 0.28, 1) both;
        }

        @keyframes splashIconIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #splash img {
                animation: none;
            }
        }
    </style>
    <script src="/Tone.js" defer></script>
    <script src="/midi" defer></script>
</head>
<body>
    <div id="splash" aria-hidden="true">
        <img src="/app-icon.png" alt="" draggable="false" />
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
