<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>MIDI 可视化播放器</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F3F3F3;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #202020;
            }
        }

        img {
            width: 132px;
            height: 132px;
            user-select: none;
            -webkit-user-drag: none;
            animation: splashIn 340ms cubic-bezier(0.16, 0.84, 0.28, 1) both;
        }

        @keyframes splashIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            img {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <img src="app-icon.png" alt="" draggable="false">
</body>

</html>
